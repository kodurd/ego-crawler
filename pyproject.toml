[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-crawler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ego_crawler*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]